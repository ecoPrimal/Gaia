<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GAIA BUILD</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080c; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c');
const x = c.getContext('2d');
function size() {
  c.width = innerWidth;
  c.height = innerHeight;
}
addEventListener('resize', size);
size();
function frame(t) {
  const w = c.width, h = c.height;
  const cx = w * 0.5, cy = h * 0.52;
  const s = Math.min(w, h);
  x.fillStyle = '#07080c';
  x.fillRect(0, 0, w, h);
  const beat = 0.5 + 0.5 * Math.sin(t * 0.004);
  const R = s * (0.16 + beat * 0.025);
  const g = x.createRadialGradient(cx, cy, R * 0.1, cx, cy, R * 2.2);
  g.addColorStop(0, 'rgba(255, 196, 80, 0.55)');
  g.addColorStop(0.45, 'rgba(40, 80, 120, 0.25)');
  g.addColorStop(1, 'rgba(0, 0, 0, 0)');
  x.fillStyle = g;
  x.beginPath();
  x.arc(cx, cy, R * 2.2, 0, Math.PI * 2);
  x.fill();
  x.strokeStyle = 'rgba(232, 196, 122, 0.85)';
  x.lineWidth = 2;
  x.beginPath();
  x.arc(cx, cy, R, 0, Math.PI * 2);
  x.stroke();
  x.strokeStyle = 'rgba(232, 196, 122, 0.35)';
  x.beginPath();
  x.moveTo(cx - R, cy);
  x.lineTo(cx + R, cy);
  x.moveTo(cx, cy - R);
  x.lineTo(cx, cy + R);
  x.stroke();
  x.fillStyle = '#f4f1e8';
  x.beginPath();
  x.arc(cx, cy, 7 + beat * 4, 0, Math.PI * 2);
  x.fill();
  x.strokeStyle = 'rgba(120, 210, 160, 0.9)';
  x.lineWidth = 3;
  x.beginPath();
  for (let i = 0; i <= 80; i++) {
    const u = i / 80;
    const a = -0.8 + u * 1.6 + Math.sin(t * 0.003) * 0.35;
    const rad = R * (1.15 + Math.sin(u * Math.PI) * 0.55);
    const px = cx + Math.cos(a) * rad;
    const py = cy - R * 0.15 + Math.sin(a) * rad * 0.45 + Math.sin(u * Math.PI) * 18;
    if (i === 0) x.moveTo(px, py);
    else x.lineTo(px, py);
  }
  x.stroke();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
